<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Đọc Truyện Cuộn Dọc</title>
  <script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://unpkg.com/epubjs@0.3.93/dist/epub.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body, html { margin: 0; padding: 0; background: #f4f4f9; font-family: sans-serif; }
    #controls {
      position: fixed; top: 0; left: 0; right: 0; height: 50px;
      background: #1e1e2f; color: #fff; display: flex; align-items: center;
      justify-content: space-around; padding: 0 5px; z-index: 10000;
    }
    select { padding: 5px; font-size: 12px; max-width: 42%; border-radius: 4px; background: #fff; color: #000; }
    button { padding: 6px 10px; font-size: 12px; border: none; background: #007bff; color: white; border-radius: 4px; }
    
    /* Vùng chứa truyện cho phép Google Dịch quét an toàn */
    #viewer { 
      width: 100%; max-width: 800px; margin: 55px auto 10px auto; 
      padding: 15px; background: #fff; min-height: 80vh; overflow-x: hidden;
    }
  </style>
</head>
<body>

  <!-- Khối điều khiển không bị dịch đè -->
  <div id="controls" class="notranslate">
    <select id="book-select">
      <option value="./COTHE.epub">Truyện 1 (COTHE)</option>
      <option value="./COTHE2.epub">Truyện 2</option>
    </select>
    <button id="prev">Trước</button>
    <select id="toc"><option>Chọn chương...</option></select>
    <button id="next">Sau</button>
  </div>

  <!-- Khối hiển thị văn bản hỗ trợ Google Dịch -->
  <div id="viewer" translate="yes">Đang tải nội dung...</div>

  <script>
    var rendition = null;

    function renderBook(file) {
      document.getElementById("viewer").innerHTML = "Đang nạp dữ liệu...";
      var select = document.getElementById("toc");
      select.innerHTML = "";

      var book = ePub(file);
      
      // Cấu hình tối ưu riêng cho bộ dịch của Google trên di động
      rendition = book.renderTo("viewer", {
        flow: "scrolled-doc",
        width: "100%",
        height: "100%",
        method: "continuous"
      });

      rendition.display();

      book.loaded.navigation.then(function(toc){
        select.innerHTML = "";
        toc.forEach(function(chapter) {
          var option = document.createElement("option");
          option.textContent = chapter.label.trim();
          option.ref = chapter.href;
          select.appendChild(option);
        });

        select.onchange = function(){
          var index = select.selectedIndex;
          var url = select.options[index].ref;
          rendition.display(url);
        };
      });
    }

    // Tự chạy khi tải xong
    setTimeout(function() {
      renderBook("./COTHE.epub");
    }, 300);
