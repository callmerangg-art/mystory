<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đọc Truyện Cuộn Dọc</title>
  <!-- Sử dụng link nguồn siêu ổn định chống nghẽn -->
  <script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://unpkg.com/epubjs@0.3.93/dist/epub.min.js"></script>
  <style>
    body, html { margin: 0; padding: 0; background: #f4f4f9; font-family: sans-serif; }
    #controls {
      position: fixed; top: 0; left: 0; right: 0; height: 50px;
      background: #1e1e2f; color: #fff; display: flex; align-items: center;
      justify-content: space-around; padding: 0 10px; z-index: 1000;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    select { padding: 5px 8px; font-size: 13px; max-width: 40%; border-radius: 4px; border: 1px solid #444; }
    button { padding: 5px 10px; font-size: 13px; cursor: pointer; border: none; background: #007bff; color: white; border-radius: 4px; }
    #viewer { max-width: 800px; margin: 60px auto 20px auto; padding: 20px; background: #fff; min-height: 90vh; box-shadow: 0 0 10px rgba(0,0,0,0.05); }
  </style>
</head>
<body>

  <div id="controls">
    <select id="book-select">
      <option value="./COTHE.epub">Truyện 1 (COTHE)</option>
      <option value="./COTHE2.epub">Truyện 2</option>
    </select>
    <button id="prev">Trước</button>
    <select id="toc"></select>
    <button id="next">Sau</button>
  </div>

  <div id="viewer">Đang tải truyện...</div>

  <script>
    var rendition = null;

    function renderBook(file) {
      document.getElementById("viewer").innerHTML = "";
      var select = document.getElementById("toc");
      select.innerHTML = "";

      var book = ePub(file);
      rendition = book.renderTo("viewer", {
        flow: "scrolled-doc",
        width: "100%"
      });

      rendition.display();

      book.loaded.navigation.then(function(toc){
        toc.forEach(function(chapter) {
          var option = document.createElement("option");
          option.textContent = chapter.label.trim();
          option.ref = chapter.href;
          select.appendChild(option);
        });

        select.onchange = function(){
          var index = select.selectedIndex;
          var url = select.options[index].ref;
          rendition.display(url);
        };
      });
    }

    // Tải truyện ban đầu
    renderBook("./COTHE.epub");

    // Đổi truyện
    document.getElementById("book-select").onchange = function() {
      renderBook(this.value);
    };

    document.getElementById("next").onclick = function() { if(rendition) rendition.next(); };
    document.getElementById("prev").onclick = function() { if(rendition) rendition.prev(); };
  </script>
</body>
</html>
