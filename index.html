<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đọc Truyện Cuộn Dọc</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    body, html { margin: 0; padding: 0; background: #f4f4f9; font-family: sans-serif; }
    #controls {
      position: fixed; top: 0; left: 0; right: 0; height: 50px;
      background: #1e1e2f; color: #fff; display: flex; align-items: center;
      justify-content: space-around; padding: 0 10px; z-index: 1000;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    select { padding: 5px 8px; font-size: 13px; max-width: 40%; border-radius: 4px; border: 1px solid #444; }
    #viewer { max-width: 800px; margin: 60px auto 20px auto; padding: 30px; background: #fff; min-height: 90vh; box-shadow: 0 0 10px rgba(0,0,0,0.05); line-height: 1.6; font-size: 16px; }
    #viewer img { max-width: 100%; height: auto; display: block; margin: 10px auto; }
    .error { color: red; font-weight: bold; text-align: center; padding: 20px; }
  </style>
</head>
<body>

  <div id="controls">
    <select id="book-select">
      <option value="COTHE.epub">Truyện 1 (COTHE)</option>
      <option value="COTHE2.epub">Truyện 2</option>
    </select>
    <select id="toc"><option>Đang tải danh sách chương...</option></select>
  </div>

  <div id="viewer">Đang tải nội dung truyện, vui lòng đợi...</div>

  <script>
    async function loadBook(filename) {
      const viewer = document.getElementById("viewer");
      const tocSelect = document.getElementById("toc");
      viewer.innerHTML = "Đang mở file truyện...";
      tocSelect.innerHTML = "<option>Đang tải...</option>";

      try {
        const response = await fetch(filename);
        if (!response.ok) throw new Error("Không thể tải file " + filename);
        const blob = await response.blob();
        const zip = new JSZip();
        const zipContent = await zip.loadAsync(blob);

        // Tìm file .opf để đọc cấu trúc truyện
        let opfPath = "";
        let containerFile = zipContent.file("META-INF/container.xml");
        if (containerFile) {
          let containerXml = await containerFile.async("text");
          let match = containerXml.match(/full-path="([^"]+)"/);
          if (match) opfPath = match[1];
        }

        if (!opfPath) {
          // Fallback tìm file opf bất kỳ
          let opfFiles = Object.keys(zipContent.files).filter(f => f.endsWith(".opf"));
          if (opfFiles.length > 0) opfPath = opfFiles[0];
        }

        viewer.innerHTML = "<div class='error'>Đã nạp file thành công! Hãy chọn chương ở góc trên để đọc.</div>";
        tocSelect.innerHTML = "<option>Đã tải xong (Hệ thống cuộn mở rộng)</option>";

      } catch (err) {
        viewer.innerHTML = `<div class='error'>❌ Lỗi: ${err.message}. Kiểm tra lại tên file hoặc đường truyền!</div>`;
        tocSelect.innerHTML = "<option>Lỗi tải</option>";
      }
    }

    // Chạy mặc định khi mở web
    loadBook("COTHE.epub");

    document.getElementById("book-select").onchange = function() {
      loadBook(this.value);
    };
  </script>

</body>
</html>
